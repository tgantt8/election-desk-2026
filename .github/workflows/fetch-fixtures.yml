name: fetch-fixtures
# Downloads public fixtures (source documents the parsers are tested against) into fixtures/ and commits them.
# The Code session's shell reaches github.com and a few hosts only, so fixtures come in through this runner. Manual only.
# One line per file: "<dest under fixtures/> | <public URL> | <note for fixtures/README.md>"
on:
  workflow_dispatch:
    inputs:
      files:
        description: "One per line: dest | url | note"
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          mkdir -p fixtures
          printf '%s\n' "$FILES" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            dest=$(printf '%s' "$line" | awk -F'|' '{print $1}' | xargs)
            url=$(printf '%s' "$line" | awk -F'|' '{print $2}' | xargs)
            note=$(printf '%s' "$line" | awk -F'|' '{print $3}' | xargs)
            mkdir -p "fixtures/$(dirname "$dest")"
            curl -sSL --retry 3 --retry-delay 5 -A "election-desk-2026 fixture fetch (info@ganttformichigan.com)" -o "fixtures/$dest" "$url"
            ls -la "fixtures/$dest"; file "fixtures/$dest" || true
            (cd fixtures && sha256sum "$dest") | tee -a fixtures/SHA256SUMS
            printf '\n- `%s` — %s  \n  source: <%s>  \n  fetched: %s\n' "$dest" "$note" "$url" "$(date -u +%FT%TZ)" >> fixtures/README.md
          done
      - name: Hygiene
        run: python3 tools/hygiene_check.py --all
      - name: Commit
        run: |
          git config user.name "election-desk-bot"
          git config user.email "info@ganttformichigan.com"
          git add fixtures
          git commit -m "fixtures: $(git diff --cached --name-only | grep -v README | grep -v SHA256 | sed 's#fixtures/##' | tr '\n' ' ')" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 10; done
