name: manual-entry
# Append a manually entered record set (results pasted from a source, an attributed media call, a hand-captured rating label, or a
# Michigan dashboard early-vote capture) to the right layer.
# The payload is the JSON the desk's Ops panel copies to the clipboard ("Copy as JSON" / "Copy call JSON").
# Nothing is overwritten: every entry is a new snapshot row plus appended records.
on:
  workflow_dispatch:
    inputs:
      layer:
        description: "results, calls, ratings or early_vote"
        required: true
        default: "calls"
      payload:
        description: "JSON payload from the desk's Ops panel"
        required: true
      note:
        description: "Where it came from (URL, screen, time)"
        required: false
        default: ""
jobs:
  enter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Append entry, rebuild, push (reset-to-main pattern; never rebases derived files)
        env:
          LAYER: ${{ inputs.layer }}
          PAYLOAD: ${{ inputs.payload }}
          NOTE: ${{ inputs.note }}
        run: |
          git config user.name "election-desk-bot"
          git config user.email "info@ganttformichigan.com"
          # The loop commits to main every few minutes and regenerates every derived file, so a rebase of this job's commit
          # would conflict on docs/data/*.json and fail silently (the old retry loop ended in `sleep`, which returns 0).
          # Same pattern as tools/push_capture.sh: start from the current main, apply the entry, rebuild, push; on a race
          # start over from the new main. The entry is idempotent only in the sense that nothing is written when it fails.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/manual_entry.py --layer "$LAYER" --note "$NOTE" --payload-env PAYLOAD
            python3 tools/run_anomalies.py || true
            python3 tools/build_polls_site.py && python3 tools/build_results_site.py && python3 tools/simulate.py && python3 tools/build_site_data.py
            python3 tools/hygiene_check.py --all
            git add data docs/data
            git commit -q -m "manual-entry ($LAYER): $(date -u +%FT%TZ)" || { echo "nothing to commit"; exit 0; }
            if git push -q origin HEAD:main; then echo "pushed $(git rev-parse --short HEAD)"; exit 0; fi
            echo "push raced with the loop (attempt $attempt); re-applying on the new main"; sleep 5
          done
          echo "manual entry did not land after 5 attempts"; exit 1
