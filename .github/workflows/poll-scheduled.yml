name: poll-scheduled
# Pre-election cadence: every 30 minutes (GitHub cron runs late under load; that's fine before Nov 3).
# Election night uses election-night.yml (a long-running loop), not this cron.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency:
  group: pollers
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Poll all active sources (one pass)
        run: python3 tools/poll_all.py || true
      - name: Rebuild site data
        run: |
          python3 tools/build_results_site.py
          python3 tools/build_site_data.py
      - name: Hygiene
        run: python3 tools/hygiene_check.py --all
      - name: Commit
        run: |
          git config user.name "election-desk-bot"
          git config user.email "info@ganttformichigan.com"
          git add data docs/data
          git commit -m "poll: $(date -u +%FT%TZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 10; done
