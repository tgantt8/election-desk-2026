name: hygiene
on:
  push:
  pull_request:
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public-repo hygiene check (all tracked files)
        run: python3 tools/hygiene_check.py --all
      - name: Unit tests
        run: |
          pip install -q -r requirements.txt
          pytest -q
